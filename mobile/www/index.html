<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEEDA: offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1e1d24; --muted: #5a536f; --primary: #4f2fc9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14111f; --fg: #f2effa; --muted: #b6aecb; --primary: #a48bff; } img { filter: invert(1); } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: min(280px, 80vw); height: auto; }
    h1 { font-size: 1.25rem; margin: 24px 0 8px; }
    p { color: var(--muted); margin: 0 auto 24px; max-width: 32ch; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="SEEDA Content Operations Hub">
    <h1>You're offline</h1>
    <p>The hub needs an internet connection. Your work is saved online, so nothing is lost.</p>
    <button type="button" onclick="location.href='https://seedafinal1.vercel.app/dashboard'">Try again</button>
  </main>
</body>
</html>
