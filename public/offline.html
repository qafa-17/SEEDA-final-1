<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline · SEEDA Hub</title>
<style>
  :root { --bg: #ffffff; --surface: #fdfaf3; --text: #1f1936; --muted: #5a536f; --border: #e4dccb; --primary: #4f2fc9; --on-primary: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14111f; --surface: #1e1a30; --text: #ece8f8; --muted: #aaa3c4; --border: #353050; --primary: #a48bff; --on-primary: #14111f; }
    .logo { filter: invert(1); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; }
  .logo { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { margin-top: 12px; font: inherit; font-weight: 600; color: var(--on-primary); background: var(--primary); border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icons/icon-192.png" alt="SEEDA Hub">
  <h1>You're offline</h1>
  <p>The hub needs an internet connection to load articles, research and drafts.</p>
  <p>Anything you already saved is safe. Reconnect, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Reload by itself as soon as the connection comes back.
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
